[bar.default]
auto_hide = true
position = "right"
reserve_space = false
scale = 1.5000000149011612
start = [ "launcher", "caffeine", "cpu", "ram" ]
thickness = 46

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1081.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[nightlight]
enabled = true
force = true

[shell]
settings_show_advanced = true
telemetry_enabled = true
ui_scale = 1.300000011920929

[theme]
builtin = "Nord"

[widget.control-center]
glyph = "settings-cog"

[widget.ram]
stat = "ram_pct"